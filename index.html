    function showSection(id) {

        btn.classList.toggle('tab-active',
          (btn.textContent.includes(id==='carbon'? (document.documentElement.lang==='zh-CN'? '碳排放数据库':'Carbon Emission Database') :
           id==='esg'? (document.documentElement.lang==='zh-CN'? 'ESG 资源':'ESG Resources') :

           '生命周期评价' 
          )));
      });
